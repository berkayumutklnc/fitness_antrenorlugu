<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Çalışma Merkezi</title>
<meta name="description" content="Athletic House Uluslararası Fitness Eğitmenliği: 18 ünite konu anlatımı, quizler, deneme sınavları, hareket analizi atlası ve bitirme projesi rehberi.">
<meta name="theme-color" content="#1F3A93">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: study app. Desktop = left rail nav + one reading column (+ in-page TOC on wide screens). Phone = top bar + bottom tab bar, single column. Plane chips (sagittal/frontal/transvers) keep the same colours everywhere. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface2:#F8F9F6; --ink:#16201B; --muted:#5A655F; --line:#DADFD9; --line2:#C9D0C9;
  --accent:#1F3A93; --accent-ink:#FFFFFF; --accent-soft:#E3E8F6;
  --hot:#B8452A; --hot-soft:#F7E6DF;
  --ok:#1C7A44; --ok-soft:#E0F1E6; --bad:#B3351F; --bad-soft:#F8E3DE; --warn:#946200; --warn-soft:#F7EDD2;
  --sag:#2457A6; --sag-soft:#E1EAF7; --fro:#8F5A00; --fro-soft:#F6EBD3; --tra:#1E7650; --tra-soft:#DDF0E6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail:232px; --top:56px; --tabbar:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1A; --surface2:#1C241F; --ink:#E6ECE8; --muted:#9BA6A0; --line:#2A332E; --line2:#39433D;
  --accent:#8FA5F2; --accent-ink:#0F1412; --accent-soft:#1F2846;
  --hot:#F0957B; --hot-soft:#3A2119;
  --ok:#5FCB8C; --ok-soft:#15301F; --bad:#F38B75; --bad-soft:#3B1D17; --warn:#E3B95B; --warn-soft:#352A12;
  --sag:#8CB2F0; --sag-soft:#1B2840; --fro:#E7B65E; --fro-soft:#352812; --tra:#6FD1A2; --tra-soft:#14301F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1A; --surface2:#1C241F; --ink:#E6ECE8; --muted:#9BA6A0; --line:#2A332E; --line2:#39433D;
  --accent:#8FA5F2; --accent-ink:#0F1412; --accent-soft:#1F2846;
  --hot:#F0957B; --hot-soft:#3A2119;
  --ok:#5FCB8C; --ok-soft:#15301F; --bad:#F38B75; --bad-soft:#3B1D17; --warn:#E3B95B; --warn-soft:#352A12;
  --sag:#8CB2F0; --sag-soft:#1B2840; --fro:#E7B65E; --fro-soft:#352812; --tra:#6FD1A2; --tra-soft:#14301F;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
[hidden]{display:none!important}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:700}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:600}
h4{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{position:fixed;inset:0 0 auto 0;height:calc(var(--top) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--line);z-index:30;display:flex;align-items:center}
.top .in{display:flex;align-items:center;gap:10px;width:100%;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tx{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.top .sp{flex:1}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--surface2);border-color:var(--line)}
.rail{position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;left:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 24px;z-index:20}
.rail a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.rail a:hover{background:var(--surface2)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a svg{flex:none;opacity:.85}
.rail .sec{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:14px 12px 4px}
.rail .units a{padding:6px 12px;font-size:14px;gap:10px}
.rail .units a i{font-style:normal;font-family:var(--display);font-weight:700;font-size:15px;width:22px;color:var(--muted)}
.rail .units a.done i{color:var(--ok)}
.tabbar{display:none}
main{padding-top:calc(var(--top) + env(safe-area-inset-top,0px));margin-left:var(--rail);min-height:100vh}
.page{max-width:860px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.page.wide{max-width:1180px}
.loading{padding:60px 0;color:var(--muted);text-align:center}
@media (max-width:980px){
  .rail{display:none}
  main{margin-left:0;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em}
  .tabbar a.on{color:var(--accent)}
  .page{padding-top:20px}
  h1{font-size:28px}
}
@media (max-width:420px){.brand span{display:none}}

/* ---------- generic UI ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stack{display:grid;gap:16px}
.stack>*,.grid>*,.g2>*,.g3>*,.tiles>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.seg a{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;padding:7px 14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.seg [aria-selected="true"],.seg .on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.seg.scroll::-webkit-scrollbar{display:none}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.chipsel button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.eyebrow{font-family:var(--display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--hot)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.bar.ok i{background:var(--ok)}
input[type=search],input[type=number],input[type=text],select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
input[type=number]{width:100%}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:15px}
label.chk input{width:18px;height:18px;accent-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:10px}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.callout.hot{border-color:var(--hot);background:var(--hot-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;line-height:1.8;overflow-x:auto}
.formula small{font-family:inherit;color:var(--muted)}
.kpi{display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (min-width:981px){.toast{bottom:28px}}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
td p{margin:0}
td.r,th.r{text-align:right}
.wide-t table{min-width:900px}

/* ---------- reading content (converted docs) ---------- */
.doc{font-size:16.5px;line-height:1.7;max-width:72ch}
.doc>*+*{margin-top:14px}
.doc h2{font-size:28px;margin-top:40px;padding-top:6px;border-top:2px solid var(--ink)}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:21px;margin-top:28px;color:var(--accent)}
.doc h4{margin-top:20px}
.doc ul,.doc ol{padding-left:22px}
.doc li+li{margin-top:6px}
.doc li p{margin:0}
.doc li p+p{margin-top:6px}
.doc strong{font-weight:600}
.doc blockquote{margin:0;border-left:4px solid var(--hot);background:var(--hot-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.doc .tw{max-width:none}
.doc figure{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:hidden}
.doc figure img{display:block;max-width:100%;height:auto;margin:0 auto}
.doc figcaption{font-size:13px;color:#4f5a54;text-align:center;padding-top:6px}
.doc img{max-width:100%;height:auto}
.doc hr{border:0;border-top:1px solid var(--line)}
.doc code{font-size:.92em;background:var(--surface2);padding:1px 5px;border-radius:4px}
.readwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.toc{display:none}
@media (min-width:1260px){
  .page.unit{max-width:1180px}
  .readwrap{grid-template-columns:minmax(0,1fr) 250px}
  .toc{display:block;position:sticky;top:calc(var(--top) + 20px);align-self:start;max-height:calc(100vh - var(--top) - 40px);overflow:auto;font-size:14px;border-left:1px solid var(--line);padding-left:16px}
  .toc b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin-bottom:8px}
  .toc button{display:block;text-align:left;width:100%;background:none;border:0;padding:5px 0;cursor:pointer;color:var(--muted);line-height:1.35}
  .toc button:hover,.toc button.on{color:var(--accent)}
  .tocm{display:none!important}
}
.tocm{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tocm summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.tocm summary::-webkit-details-marker{display:none}
.tocm summary::after{content:"+";font-family:var(--display);font-size:22px;line-height:1;color:var(--muted)}
.tocm[open] summary::after{content:"–"}
.tocm .ls{display:grid;padding:0 8px 10px}
.tocm button{text-align:left;background:none;border:0;padding:8px 8px;border-radius:6px;cursor:pointer;font-size:15px}
.tocm button:hover{background:var(--surface2)}

/* ---------- unit header ---------- */
.uhead{display:grid;gap:10px;margin-bottom:18px}
.uhead .no{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}
.unav{display:flex;justify-content:space-between;gap:10px;margin-top:36px;flex-wrap:wrap}
.unav a{flex:1 1 240px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.unav a:hover{border-color:var(--accent)}
.unav a small{color:var(--muted);font-size:13px}
.unav a.nx{text-align:right}

/* ---------- unit list ---------- */
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ucard{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ucard:hover{border-color:var(--accent)}
.ucard .n{grid-row:span 3;font-family:var(--display);font-size:38px;font-weight:700;line-height:1;color:var(--line2)}
.ucard.done .n{color:var(--ok)}
.ucard h3{font-size:19px}
.ucard .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- quiz ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.qn{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.qtag{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right}
.qt{font-weight:500;font-size:16.5px}
.opts{display:grid;gap:7px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.4;font-size:15.5px}
.opt b{font-family:var(--display);font-size:17px;min-width:16px;color:var(--muted);line-height:1.25}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right b{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong b{color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{font-size:15px;border-left:3px solid var(--line2);padding:2px 0 2px 12px;color:var(--ink)}
.exp.ok{border-color:var(--ok)} .exp.bad{border-color:var(--bad)}
.exp strong{font-weight:600}
.qgroup{font-family:var(--display);font-size:19px;font-weight:600;color:var(--muted);margin-top:10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.scorebar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding:10px 0;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.flash{display:grid;gap:12px}
.ah{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.ah .ans{display:grid;gap:6px;background:var(--ok-soft);border-radius:8px;padding:10px 12px}
.ah .ans b{color:var(--ok);font-weight:600}
.ah .self{display:flex;gap:6px}
.big{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.cardq{max-width:680px;margin:0 auto}
.fcard{min-height:240px;display:grid;align-content:center;gap:14px;text-align:center;padding:28px 20px;cursor:pointer;user-select:none}
.fcard .qt{font-size:20px}
.fcard .a{font-family:var(--display);font-size:24px;font-weight:700;color:var(--ok)}

/* ---------- atlas ---------- */
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-Sagittal{background:var(--sag-soft);color:var(--sag)}
.p-Frontal{background:var(--fro-soft);color:var(--fro)}
.p-Transvers{background:var(--tra-soft);color:var(--tra)}
.p-none{background:var(--surface2);color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lead{color:var(--muted)}
.note{font-size:14.5px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
ol.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.exh{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;align-items:baseline}
.sub{color:var(--muted);font-size:14px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.roles{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:15px;margin:0}
.roles dt{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.roles dt.ag{color:var(--accent)}
.roles dd{margin:0;min-width:0}
.mini td,.mini th{padding:6px 8px}
.atlas-kavram{display:grid;gap:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input[type=search]{flex:1 1 220px}
@media (max-width:560px){.roles{grid-template-columns:1fr;gap:2px}.roles dd{margin-bottom:8px}}

/* ---------- proje ---------- */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.calc label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.res td:nth-child(2){font-family:var(--display);font-size:18px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.cat{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c0{background:var(--ok-soft);color:var(--ok)} .c1{background:#E6F2DC;color:#3D6E1C} .c2{background:var(--accent-soft);color:var(--accent)} .c3{background:var(--warn-soft);color:var(--warn)} .c4{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c1{background:#1F3315;color:#A7D98A}}
:root[data-theme="dark"] .c1{background:#1F3315;color:#A7D98A}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;counter-reset:s}
.steps4 .card{position:relative;padding-top:42px}
.steps4 .card::before{counter-increment:s;content:counter(s);position:absolute;top:10px;left:16px;font-family:var(--display);font-weight:700;font-size:28px;color:var(--hot);line-height:1}
.report{white-space:pre-wrap;font-size:15px;line-height:1.65;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:14px}
details.tp{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.tp>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.tp>summary::-webkit-details-marker{display:none}
details.tp>summary h4{font-size:18px}
details.tp>div{padding:0 14px 14px;display:grid;gap:10px}
details.tp[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}

/* ---------- search ---------- */
.sres{display:grid;gap:8px}
.sres a{display:grid;gap:3px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sres a:hover{border-color:var(--accent)}
.sres mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.sres .t{font-weight:600}

/* ---------- home ---------- */
.hero{display:grid;gap:14px;padding:6px 0 10px}
.hero h1{font-size:40px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative}
.tile:hover{border-color:var(--accent)}
.tile .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile h3{font-size:21px}
.dist{display:grid;gap:8px}
.dist .r{display:grid;grid-template-columns:minmax(120px,240px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.dist .r .bar{height:12px}
@media (max-width:560px){.hero h1{font-size:32px}.dist .r{grid-template-columns:1fr 70px 36px}}
.starb{width:32px;height:32px;color:var(--muted)}
.starb.on{color:#D99A00}.starb.on svg{fill:#F2B705}
.menub{display:none}
@media (max-width:980px){.menub{display:inline-grid}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;justify-content:flex-end}
.sheet-in{background:var(--surface);width:min(320px,86vw);height:100%;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 24px;display:grid;align-content:start;gap:2px}
.sheet-in a{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.sheet-in a:hover{background:var(--surface2)}
.doc{font-size:calc(16.5px * var(--fz,1))}
.qt{font-size:calc(16.5px * var(--fz,1))}
.opt{font-size:calc(15.5px * var(--fz,1))}
.exp{font-size:calc(15px * var(--fz,1))}
.fcard .qt{font-size:calc(20px * var(--fz,1))}
table.prog input{font-size:14px;padding:6px 8px;min-width:60px}
table.prog td{padding:5px 6px}
.calc input[type=text]{width:100%}
.goalbar{display:grid;gap:6px}
@media print{.card{border:1px solid #999;break-inside:avoid}input,select{border:0!important;background:none!important;padding:0!important;color:#000!important}.uhead .seg{display:none!important}}
@media print{.top,.rail,.tabbar,.noprint{display:none!important}main{margin:0;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* anatomi kampı */
:root{--mus:#E9A891;--mus-st:#B8452A;--bone:#EFE8D8;--bone-st:#9C9178;--silf:#F1ECE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mus:#7C3E2E;--mus-st:#F0957B;--bone:#4A463C;--bone-st:#B8AE95;--silf:#232B26}}
:root[data-theme="dark"]{--mus:#7C3E2E;--mus-st:#F0957B;--bone:#4A463C;--bone-st:#B8AE95;--silf:#232B26}
.anwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.anwrap{grid-template-columns:minmax(260px,380px) minmax(0,1fr)}.anwrap>.stack{position:sticky;top:calc(var(--top) + 12px)}}
.anfig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center}
svg.body{width:100%;max-width:340px;height:auto;max-height:72vh;touch-action:manipulation}
svg.body .sil{fill:var(--silf);stroke:var(--line2);stroke-width:1}
svg.body .ms{fill:var(--mus);stroke:var(--mus-st);stroke-width:.8;cursor:pointer;transition:fill .15s}
svg.body .bn{fill:var(--bone);stroke:var(--bone-st);stroke-width:.8;cursor:pointer;transition:fill .15s}
svg.body .bn[data-id="scap"]{opacity:.55}
svg.body path:is(.ms,.bn):hover{fill:var(--accent-soft)}
svg.body path.sel{fill:var(--accent)!important;stroke:var(--accent)}
svg.body path.ok{fill:var(--ok)!important;stroke:var(--ok)}
svg.body path.bad{fill:var(--bad)!important;stroke:var(--bad)}
svg.body .spine{stroke:var(--line2);stroke-dasharray:3 3;fill:none}
svg.body .midl{stroke:var(--muted);stroke-dasharray:4 4}
svg .svlbl,svg .ax{font:600 10px var(--body);fill:var(--muted);letter-spacing:.08em}
svg .arw{stroke:var(--hot);stroke-width:4;fill:none;stroke-linecap:round}
svg .arwf{fill:var(--hot)}
.chipsel button.deep{color:var(--muted);border-style:dashed}
.chipsel.wrap{flex-wrap:wrap}
.andl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.andl dt{font-weight:600;color:var(--muted)}.andl dd{margin:0}
.spinesv{width:100%;max-width:200px;justify-self:center}
svg.body.lbls{max-width:430px}
@media (max-width:899px){svg.body:not(.lbls){max-height:50vh}}
svg .lbl-l{fill:none;stroke:var(--muted);stroke-width:.5}
svg .lbl-d{fill:var(--ink)}
svg .lbl-t{font:500 8.5px var(--body);fill:var(--ink)}
svg g.lb{cursor:pointer}
svg g.lb.sel .lbl-t{fill:var(--accent);font-weight:700}
svg g.lb.sel .lbl-l{stroke:var(--accent);stroke-width:1}
.spinesv path{fill:none;stroke-width:9;stroke-linecap:round}
.spinesv text{font:600 12px var(--body);fill:var(--ink)}
.planes .plane{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start}
.planes .plane svg{width:100%;max-width:180px;justify-self:center}
.planes h3{margin:4px 0 0}.planes p{margin:0}
.plane.sag{background:var(--sag-soft)}.plane.fro{background:var(--fro-soft)}.plane.tra{background:var(--tra-soft)}
.plane .pbg{fill:var(--surface);opacity:.7}
.plane .stk{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
.plane.sag .arm{stroke:var(--sag)}.plane.fro .arm{stroke:var(--fro)}
.plane .nose{fill:var(--tra)}
.armS{transform-origin:60px 44px;animation:anS 3s ease-in-out infinite}
.armF1{transform-origin:54px 44px;animation:anF1 3s ease-in-out infinite}
.armF2{transform-origin:66px 44px;animation:anF2 3s ease-in-out infinite}
.rotH{transform-origin:60px 70px;animation:anH 3s ease-in-out infinite}
@keyframes anS{0%,15%{transform:rotate(0)}50%,65%{transform:rotate(-150deg)}100%{transform:rotate(0)}}
@keyframes anF1{0%,15%{transform:rotate(0)}50%,65%{transform:rotate(100deg)}100%{transform:rotate(0)}}
@keyframes anF2{0%,15%{transform:rotate(0)}50%,65%{transform:rotate(-100deg)}100%{transform:rotate(0)}}
@keyframes anH{0%,15%{transform:rotate(-40deg)}50%,65%{transform:rotate(40deg)}100%{transform:rotate(-40deg)}}
@media (prefers-reduced-motion:reduce){.armS,.armF1,.armF2,.rotH{animation:none}}
.pill.pl-sag{background:var(--sag-soft);color:var(--sag);border-color:transparent}
.pill.pl-fro{background:var(--fro-soft);color:var(--fro);border-color:transparent}
.pill.pl-tra{background:var(--tra-soft);color:var(--tra);border-color:transparent}
.ankart{max-width:640px}
.ankart .kf{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1}
.ankart .kbk{border-top:1px solid var(--line);padding-top:10px;line-height:1.7}
/* uygulamalı sınav */
.uyc summary{cursor:pointer;list-style:none}
.uyc summary::-webkit-details-marker{display:none}
.uyc[open] summary{border-bottom:1px solid var(--line);padding-bottom:10px}
.uyh{font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.uystep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.uystep p,.uystep ul{margin:4px 0}
.uyn{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.uyq{font-style:italic;background:var(--surface2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0}
.uydia p{margin:8px 0;line-height:1.6}
.uydia .pill{margin-right:6px}
.uyask{font-family:var(--display);font-size:26px;line-height:1.25;font-weight:600;margin:4px 0}
.uyhoca{border:2px solid var(--accent)}
</style>
</head>
